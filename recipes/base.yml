---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: base

description: "Personal Fedora Atomic image based on Universal Blue, Base image with no gui."

base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:

  - from-file: ../modules/20-system/common-system.yml
  - from-file: ../modules/30-apps/common-apps.yml
  - from-file: ../modules/80-cleanup/common-cleanup.yml


  # -----------------------------------------------
  # OS details
  # -----------------------------------------------

  - type: os-release
    properties:
      ID: aspenblue-base
      ID_LIKE: fedora
      NAME: "Aspenblue Base"
      PRETTY_NAME: "Aspenblue Base 44 (Fedora Atomic)"
      VERSION: "44"
  #    VARIANT: ""
  #    VARIANT_ID: 
      HOME_URL: "https://github.com/aspenblue/main"


  # -----------------------------------------------
  # Sign image
  # -----------------------------------------------

  - type: signing